# Canonical HTTPS host.
server {
    server_name 24logist.ru;
    listen 147.45.236.73:443 ssl;

    ssl_certificate "/var/www/httpd-cert/24logist.ru_2026-06-13-10-54_05.crt";
    ssl_certificate_key "/var/www/httpd-cert/24logist.ru_2026-06-13-10-54_05.key";

    add_header Strict-Transport-Security "max-age=31536000" always;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/pdf
        application/xml
        image/svg+xml;

    set $root_path /var/www/logist_sys/data/www/24logist.ru;
    root $root_path;
    index index.php index.html;

    disable_symlinks if_not_owner from=$root_path;

    # The Laravel application and its secrets live below the document root.
    location ^~ /.app/ {
        deny all;
    }

    # Block hidden files, while FASTPANEL handles /.well-known/ for Let's Encrypt.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    # Must be included before the generic static-file regex below.
    include /var/www/logist_sys/data/www/24logist.ru/.app/script_ai/nginx-performance.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include /etc/nginx/fastcgi_params;
        fastcgi_pass unix:/var/run/24logist.ru.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    # Missing dynamic .txt/.xml/icon routes still fall back to Laravel.
    location ~* ^.+\.(?:avif|jpg|jpeg|gif|png|svg|js|css|mp3|ogg|mpeg|avi|zip|gz|bz2|rar|swf|ico|7z|doc|docx|map|otf|pdf|ttf|tif|txt|wav|webp|woff|woff2|xls|xlsx|xml)$ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    include "/etc/nginx/fastpanel2-sites/logist_sys/24logist.ru.includes";
    include /etc/nginx/fastpanel2-includes/*.conf;

    error_log /var/www/logist_sys/data/logs/24logist.ru-frontend.error.log;
    access_log /var/www/logist_sys/data/logs/24logist.ru-frontend.access.log;
}

# Canonicalize the HTTPS www host in one hop.
server {
    server_name www.24logist.ru;
    listen 147.45.236.73:443 ssl;

    ssl_certificate "/var/www/httpd-cert/24logist.ru_2026-06-13-10-54_05.crt";
    ssl_certificate_key "/var/www/httpd-cert/24logist.ru_2026-06-13-10-54_05.key";

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://24logist.ru$request_uri;

    error_log /var/www/logist_sys/data/logs/24logist.ru-frontend.error.log;
    access_log /var/www/logist_sys/data/logs/24logist.ru-frontend.access.log;
}

# Canonicalize both HTTP hosts directly to HTTPS without an extra redirect.
server {
    server_name 24logist.ru www.24logist.ru;
    listen 147.45.236.73:80;

    return 301 https://24logist.ru$request_uri;

    error_log /var/www/logist_sys/data/logs/24logist.ru-frontend.error.log;
    access_log /var/www/logist_sys/data/logs/24logist.ru-frontend.access.log;
}
