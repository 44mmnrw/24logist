# Основное зеркало: 24logist.ru (без www).
# Добавить в конфиг nginx для 24logist.ru (ISPmanager / vhost).

# Вариант 1 — отдельный server-блок для www (предпочтительно):
server {
    listen 443 ssl http2;
    server_name www.24logist.ru;

    # ssl_certificate ... (те же сертификаты, что и для apex)

    return 301 https://24logist.ru$request_uri;
}

server {
    listen 80;
    server_name www.24logist.ru;
    return 301 https://24logist.ru$request_uri;
}

# Вариант 2 — внутри основного server { server_name 24logist.ru; ... }:
# if ($host = www.24logist.ru) {
#     return 301 https://24logist.ru$request_uri;
# }

# APP_URL в .env на сервере:
# APP_URL=https://24logist.ru

# В Яндекс.Вебмастер и Google Search Console указать основное зеркало: 24logist.ru
