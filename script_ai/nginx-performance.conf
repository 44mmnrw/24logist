# Include these locations inside the production server block for 24logist.ru.
# Document root: /var/www/logist_sys/data/www/24logist.ru

# Vite uses content hashes, so these files can be cached permanently.
location ^~ /build/assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Fonts and versioned project images change infrequently but may keep stable URLs.
location ~* ^/(?:fonts|images)/.+\.(?:avif|webp|png|jpe?g|gif|svg|ico|woff2?)$ {
    access_log off;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    try_files $uri =404;
}

# Public CMS images and generated responsive variants.
location ~* ^/storage/(?:landing|site)/.+\.(?:avif|webp|png|jpe?g|gif|svg|ico)$ {
    access_log off;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
    try_files $uri =404;
}
