<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2220" viewBox="0 0 1000 2220" role="img" aria-labelledby="title desc">
  <title id="title">Базовый сценарий работы экспедитора без принятия груза</title>
  <desc id="desc">Экспедитор действует от имени клиента по МЧД, груз передаётся перевозчику напрямую, а электронные оригиналы поступают в архив клиента.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#edf5ff"/></linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12326d"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="expeditor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <linearGradient id="carrier" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08785a"/><stop offset="1" stop-color="#16a36a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10244a" flood-opacity=".12"/></filter>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2563eb"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#149667"/></marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#7656d6"/></marker>
    <style>
      text{font-family:Arial,sans-serif;text-rendering:geometricPrecision}
      .eyebrow{font-size:18px;font-weight:700;letter-spacing:1.5px;fill:#2563eb}
      .heading{font-size:42px;font-weight:700;fill:#10244a}
      .subtitle{font-size:24px;fill:#536b89}
      .lane{font-size:22px;font-weight:700;letter-spacing:1px;fill:#537095}
      .card{fill:#fff;stroke:#d7e3f2;stroke-width:1.5;filter:url(#shadow)}
      .roleTitle{font-size:34px;font-weight:700;fill:#fff}
      .roleSub{font-size:24px;fill:#edf3ff}
      .title{font-size:29px;font-weight:700;fill:#10244a}
      .body{font-size:23px;fill:#536b89}
      .strong{font-size:22px;font-weight:700;fill:#173d79}
      .small{font-size:20px;fill:#617694}
      .pill{font-size:20px;font-weight:700}
      .chipTitle{font-size:24px;font-weight:700;fill:#173d79}
      .chipBody{font-size:20px;fill:#617694}
      .line-blue{fill:none;stroke:#2563eb;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-blue)}
      .line-green{fill:none;stroke:#149667;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-green)}
      .line-violet{fill:none;stroke:#7656d6;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow-violet)}
    </style>
  </defs>

  <rect width="1000" height="2220" rx="28" fill="url(#bg)"/>
  <circle cx="930" cy="70" r="150" fill="#dbeafe" opacity=".7"/>
  <circle cx="60" cy="2130" r="150" fill="#dcfce7" opacity=".65"/>

  <text x="50" y="55" class="eyebrow">БАЗОВЫЙ СЦЕНАРИЙ · ЭКСПЕДИТОР НЕ ПРИНИМАЕТ ГРУЗ</text>
  <text x="50" y="112" class="heading">Кто оформляет ЭПД</text>
  <text x="50" y="162" class="heading">и где хранится оригинал</text>
  <text x="50" y="210" class="subtitle">Экспедитор организует рейс и действует от имени клиента по МЧД</text>

  <g transform="translate(50 245)">
    <rect width="900" height="200" rx="26" fill="#fff" stroke="#cad9ee" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="27" fill="#2563eb"/>
    <path d="M39 50l8 8 16-20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="95" y="47" class="strong">Юридическая модель</text>
    <text x="95" y="85" class="body">Клиент — сторона договора перевозки</text>
    <text x="95" y="118" class="body">и грузоотправитель.</text>
    <text x="95" y="153" class="body">Экспедитор — представитель, а не владелец груза.</text>
    <rect x="610" y="22" width="240" height="56" rx="28" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="730" y="58" text-anchor="middle" class="pill" fill="#be123c">Груз не принимает</text>
  </g>

  <text x="50" y="500" class="lane">1 · ЮРИДИЧЕСКИЙ И ЭЛЕКТРОННЫЙ КОНТУР</text>

  <g transform="translate(120 535)">
    <rect width="760" height="180" rx="28" fill="url(#client)" filter="url(#shadow)"/>
    <text x="380" y="55" text-anchor="middle" class="roleTitle">Клиент</text>
    <text x="380" y="96" text-anchor="middle" class="roleSub">грузоотправитель и сторона договора перевозки</text>
    <rect x="225" y="125" width="310" height="40" rx="20" fill="#fff" opacity=".16"/>
    <text x="380" y="153" text-anchor="middle" class="pill" fill="#fff">собственный ящик ЭПД</text>
  </g>

  <path d="M440 715V815" class="line-blue"/>
  <path d="M560 815V715" class="line-violet"/>
  <rect x="105" y="742" width="265" height="48" rx="24" fill="#eaf1ff" stroke="#bfd2f3"/>
  <text x="237" y="774" text-anchor="middle" class="pill" fill="#174aa6">Поручение · файл 1</text>
  <rect x="630" y="742" width="265" height="48" rx="24" fill="#f1edff" stroke="#cfc1f4"/>
  <text x="762" y="774" text-anchor="middle" class="pill" fill="#6541c7">Согласование · файл 2</text>

  <g transform="translate(120 815)">
    <rect width="760" height="255" rx="28" fill="url(#expeditor)" filter="url(#shadow)"/>
    <text x="380" y="54" text-anchor="middle" class="roleTitle">Экспедитор</text>
    <text x="380" y="94" text-anchor="middle" class="roleSub">подбирает перевозчика и оформляет документы</text>
    <rect x="215" y="117" width="330" height="40" rx="20" fill="#fff" opacity=".16"/>
    <text x="380" y="145" text-anchor="middle" class="pill" fill="#fff">представитель клиента по МЧД</text>
    <rect x="70" y="175" width="620" height="60" rx="18" fill="#fff" opacity=".96"/>
    <text x="95" y="202" class="strong">Рабочий режим: «действовать за клиента»</text>
    <text x="95" y="226" class="small">Личный вход сотрудника ≠ ящик экспедитора</text>
  </g>

  <path d="M500 1070V1205" class="line-violet"/>
  <rect x="300" y="1092" width="400" height="88" rx="22" fill="#f1edff" stroke="#cfc1f4"/>
  <text x="500" y="1128" text-anchor="middle" class="strong">Договор + ЭЗЗ + ЭТрН</text>
  <text x="500" y="1158" text-anchor="middle" class="small">от имени клиента</text>

  <g transform="translate(120 1205)">
    <rect width="760" height="180" rx="28" fill="url(#carrier)" filter="url(#shadow)"/>
    <text x="380" y="55" text-anchor="middle" class="roleTitle">Перевозчик</text>
    <text x="380" y="96" text-anchor="middle" class="roleSub">принимает заказ и выполняет перевозку</text>
    <rect x="225" y="125" width="310" height="40" rx="20" fill="#fff" opacity=".16"/>
    <text x="380" y="153" text-anchor="middle" class="pill" fill="#fff">собственный ящик ЭПД</text>
  </g>

  <text x="50" y="1450" class="lane">2 · ФИЗИЧЕСКОЕ ДВИЖЕНИЕ ГРУЗА</text>

  <g transform="translate(40 1485)">
    <rect width="280" height="210" rx="24" class="card"/><rect width="280" height="10" rx="5" fill="#2563eb"/>
    <text x="140" y="48" text-anchor="middle" class="title" style="font-size:25px">Склад / поставщик</text>
    <text x="140" y="87" text-anchor="middle" class="body" style="font-size:20px">передаёт груз</text>
    <text x="140" y="119" text-anchor="middle" class="body" style="font-size:20px">напрямую перевозчику</text>
    <text x="140" y="169" text-anchor="middle" class="strong" style="font-size:20px">не экспедитору</text>
  </g>
  <g transform="translate(360 1485)">
    <rect width="280" height="210" rx="24" class="card"/><rect width="280" height="10" rx="5" fill="#149667"/>
    <text x="140" y="48" text-anchor="middle" class="title">Перевозчик</text>
    <text x="140" y="87" text-anchor="middle" class="body" style="font-size:20px">принимает груз</text>
    <text x="140" y="119" text-anchor="middle" class="body" style="font-size:20px">по договору с клиентом</text>
    <text x="140" y="169" text-anchor="middle" class="strong" style="font-size:20px">без экспедитора</text>
  </g>
  <g transform="translate(680 1485)">
    <rect width="280" height="210" rx="24" class="card"/><rect width="280" height="10" rx="5" fill="#7656d6"/>
    <text x="140" y="48" text-anchor="middle" class="title" style="font-size:25px">Грузополучатель</text>
    <text x="140" y="87" text-anchor="middle" class="body" style="font-size:20px">принимает доставку</text>
    <text x="140" y="119" text-anchor="middle" class="body" style="font-size:20px">и формирует свой файл</text>
    <text x="140" y="169" text-anchor="middle" class="strong" style="font-size:20px">завершает ЭТрН</text>
  </g>

  <path d="M320 1590H360" class="line-green"/>
  <path d="M640 1590H680" class="line-green"/>
  <path d="M180 1695V1745H280V1770" class="line-blue"/>
  <path d="M500 1695V1770" class="line-blue"/>
  <path d="M820 1695V1745H720V1770" class="line-blue"/>

  <g transform="translate(50 1770)">
    <rect width="900" height="350" rx="28" fill="#fff" stroke="#b9cceb" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="48" cy="45" r="25" fill="#2563eb"/>
    <path d="M37 37h22v19H37zM42 32h12v5M42 44h12M42 50h9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="45" class="title">Архив клиента</text>
    <text x="90" y="74" class="body">у его оператора ЭПД</text>
    <rect x="530" y="18" width="340" height="64" rx="20" fill="#eaf1ff"/>
    <text x="700" y="45" text-anchor="middle" class="strong">Поступает автоматически</text>
    <text x="700" y="69" text-anchor="middle" class="small">напрямую или через роуминг</text>

    <g transform="translate(30 100)">
      <rect width="400" height="105" rx="18" fill="#f7faff" stroke="#d8e4f4"/>
      <text x="22" y="34" class="chipTitle">Поручение</text>
      <text x="22" y="64" class="chipBody">файл клиента + ответ экспедитора</text>
      <text x="22" y="91" class="strong">юридические оригиналы</text>
    </g>
    <g transform="translate(470 100)">
      <rect width="400" height="105" rx="18" fill="#f7faff" stroke="#d8e4f4"/>
      <text x="22" y="34" class="chipTitle">ЭЗЗ</text>
      <text x="22" y="64" class="chipBody">заказ или заявка от имени клиента</text>
      <text x="22" y="91" class="strong">обе части обмена</text>
    </g>
    <g transform="translate(30 225)">
      <rect width="400" height="105" rx="18" fill="#f7faff" stroke="#d8e4f4"/>
      <text x="22" y="34" class="chipTitle">ЭТрН</text>
      <text x="22" y="64" class="chipBody">все файлы по формату</text>
      <text x="22" y="91" class="strong">от всех участников</text>
    </g>
    <g transform="translate(470 225)">
      <rect width="400" height="105" rx="18" fill="#edf9f3" stroke="#a7dbc4"/>
      <text x="22" y="34" class="chipTitle">Доказательства</text>
      <text x="22" y="64" class="chipBody">XML, подписи, УИД и квитанции</text>
      <text x="22" y="91" class="strong">PDF — только визуализация</text>
    </g>
  </g>

  <rect x="170" y="2145" width="660" height="44" rx="22" fill="#10244a"/>
  <text x="500" y="2174" text-anchor="middle" class="pill" fill="#fff">ГИС ЭПД не заменяет архив клиента</text>
</svg>
