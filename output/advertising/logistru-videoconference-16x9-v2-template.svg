  <text x="102" y="220" font-family="Arial" font-size="58" font-weight="700" fill="#FFFFFF"><tspan x="102">Заявки, рейсы и ЭДО</tspan><tspan x="102" dy="64">в одном кабинете</tspan></text>
  <text x="102" y="340" font-family="Arial" font-size="22" fill="#DCE9FF"><tspan x="102">Полный цикл работы экспедитора — от первой заявки</tspan><tspan x="102" dy="32">до документов, контроля рейса, оплат и прибыли.</tspan></text>

