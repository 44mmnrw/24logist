  <g font-family="Arial" fill="#0D2147">
    <g><rect x="60" y="641" width="760" height="143" rx="22" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="2"/><rect x="80" y="658" width="39" height="39" rx="12" fill="#0D67F3"/><text x="100" y="686" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">1</text><text x="135" y="685" font-size="24" font-weight="700">Заявка от Заказчика</text>
