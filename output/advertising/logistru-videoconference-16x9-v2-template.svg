    <g><rect x="60" y="800" width="760" height="143" rx="22" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="2"/><rect x="80" y="817" width="39" height="39" rx="12" fill="#17AC4C"/><text x="100" y="845" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">2</text><text x="135" y="844" font-size="24" font-weight="700">Поручение и ЭПД</text>
      <g font-size="15" font-weight="700" text-anchor="middle"><g fill="#EDF9F1"><rect x="80" y="872" width="155" height="52" rx="12"/><rect x="263" y="872" width="155" height="52" rx="12"/><rect x="446" y="872" width="165" height="52" rx="12"/><rect x="639" y="872" width="161" height="52" rx="12"/></g><g fill="#17345F"><text x="158" y="891"><tspan x="158">Входящее</tspan><tspan x="158" dy="17">поручение</tspan></text><text x="341" y="904">Заказ-заявка</text><text x="528" y="891"><tspan x="528">ЭТрН в несколько</tspan><tspan x="528" dy="17">кликов</tspan></text><text x="720" y="904">Архив и аналитика</text></g></g>
      <g stroke="#7395C8" stroke-width="3"><path d="M240 898H256M251 893L257 898L251 903" fill="none"/><path d="M423 898H439M434 893L440 898L434 903" fill="none"/><path d="M616 898H632M627 893L633 898L627 903" fill="none"/></g>
    </g>
