  <text x="1725" y="953" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#0D67F3">24logist.ru</text>

  <text x="60" y="1024" font-family="Arial" font-size="20" font-weight="700" fill="#0D2147">Создайте кабинет и работайте правильно!</text>
