  <text x="880" y="876" font-family="Arial" font-size="27" font-weight="700" fill="#FFFFFF"><tspan x="880">Упрощаем работу с заявкой</tspan><tspan x="880" dy="36">от Заказчика — делаем её</tspan><tspan x="880" dy="36">простой, понятной и удобной.</tspan></text>

