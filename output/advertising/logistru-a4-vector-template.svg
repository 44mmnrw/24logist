<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2480" height="3508" viewBox="0 0 2480 3508">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D2147"/><stop offset=".62" stop-color="#123B79"/><stop offset="1" stop-color="#0D67F3"/>
    </linearGradient>
    <linearGradient id="value" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D2147"/><stop offset="1" stop-color="#0D67F3"/>
    </linearGradient>
    <linearGradient id="screenFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DCE9FF"/><stop offset="1" stop-color="#D9F8E6"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#0D67F3" opacity=".09"/>
    </pattern>
    <clipPath id="screenClip"><rect x="864" y="1118" width="1442" height="1302" rx="26"/></clipPath>
  </defs>

  <rect width="2480" height="3508" fill="#F7FAFF"/>
  <rect x="0" y="0" width="570" height="790" fill="url(#dots)"/>
  <rect x="1920" y="2700" width="560" height="808" fill="url(#dots)"/>
  <path d="M0 520C260 335 390 245 620 180S1010 130 1125 0" fill="none" stroke="#0D67F3" stroke-width="5" opacity=".13"/>
  <path d="M2480 430C2290 340 2235 220 2100 175S1875 215 1730 0" fill="none" stroke="#19BD49" stroke-width="6" opacity=".13"/>
  <path d="M0 2940C220 2800 345 3035 545 3160S900 3335 1120 3508" fill="none" stroke="#0D67F3" stroke-width="6" opacity=".16"/>
  <path d="M2480 2450C2270 2540 2245 2730 2150 2900S1975 3220 1870 3508" fill="none" stroke="#0D67F3" stroke-width="5" opacity=".13"/>
  <g fill="#19BD49" opacity=".5"><circle cx="320" cy="355" r="13"/><circle cx="2245" cy="295" r="11"/><circle cx="340" cy="3060" r="12"/><circle cx="2160" cy="2860" r="14"/></g>

  <!-- Brand row -->
  <rect x="132" y="94" width="365" height="92" rx="20" fill="#FFFFFF" stroke="#DFE8F5" stroke-width="2"/>
  <g transform="translate(157 109)">
    <circle cx="42" cy="34" r="31" fill="none" stroke="#0D67F3" stroke-width="5"/>
    <path d="M9 39H35V18H55L67 32V46H60" fill="none" stroke="#0D67F3" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="27" cy="48" r="7" fill="#0D67F3"/><circle cx="55" cy="48" r="7" fill="#0D67F3"/>
    <path d="M61 12C69 2 81 3 86 12C89 21 79 33 73 41C67 33 57 21 61 12Z" fill="#19BD49"/>
    <text x="101" y="47" font-family="Arial" font-size="43" font-weight="700" fill="#0D2147">Логист<tspan fill="#0D67F3">Ру</tspan></text>
  </g>
  <rect x="1864" y="105" width="484" height="70" rx="35" fill="#E8F0FF"/>
  <text x="2106" y="151" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#0D67F3">CRM ДЛЯ ЭКСПЕДИТОРОВ</text>

  <!-- Hero -->
  <rect x="132" y="220" width="2216" height="390" rx="42" fill="url(#hero)"/>
  <circle cx="2200" cy="205" r="260" fill="none" stroke="#19BD49" stroke-width="62" opacity=".34"/>
  <text x="194" y="347" font-family="Arial" font-size="84" font-weight="700" fill="#FFFFFF">
    <tspan x="194" dy="0">Заявки, рейсы и ЭДО</tspan><tspan x="194" dy="92">в одном кабинете</tspan>
  </text>
  <text x="194" y="529" font-family="Arial" font-size="31" fill="#DCE9FF">
    <tspan x="194">ЛогистРу упрощает полный цикл работы экспедитора: от первой заявки Заказчика</tspan>
    <tspan x="194" dy="43">до перевозочных документов, контроля рейса, оплат и прибыли.</tspan>
  </text>

  <!-- Solutions -->
  <rect x="140" y="660" width="54" height="54" rx="17" fill="#0D67F3"/>
  <text x="167" y="698" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#FFFFFF">1</text>
  <text x="214" y="702" font-family="Arial" font-size="43" font-weight="700" fill="#0D2147">Основные решения</text>
  <g font-family="Arial" font-size="31" font-weight="700" fill="#0D2147">
    <g><rect x="132" y="744" width="1085" height="116" rx="26" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="3"/><circle cx="190" cy="802" r="27" fill="#E3F8EB"/><path d="M177 802L187 813L204 787" fill="none" stroke="#12A744" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="236" y="812">Создавайте заявки</text></g>
    <g><rect x="1235" y="744" width="1113" height="116" rx="26" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="3"/><circle cx="1293" cy="802" r="27" fill="#E3F8EB"/><path d="M1280 802L1290 813L1307 787" fill="none" stroke="#12A744" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1339" y="812">Контролируйте оплаты</text></g>
    <g><rect x="132" y="878" width="1085" height="116" rx="26" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="3"/><circle cx="190" cy="936" r="27" fill="#E3F8EB"/><path d="M177 936L187 947L204 921" fill="none" stroke="#12A744" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="236" y="946">Следите за статусом доставки</text></g>
    <g><rect x="1235" y="878" width="1113" height="116" rx="26" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="3"/><circle cx="1293" cy="936" r="27" fill="#E3F8EB"/><path d="M1280 936L1290 947L1307 921" fill="none" stroke="#12A744" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1339" y="928"><tspan x="1339">Формируйте перевозочные документы</tspan><tspan x="1339" dy="37">согласно ФЗ</tspan></text></g>
  </g>

  <!-- Request -->
  <rect x="132" y="1068" width="682" height="1400" rx="34" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="3"/>
  <rect x="178" y="1550" width="176" height="54" rx="27" fill="#EAF1FF"/>
  <text x="266" y="1587" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#0D67F3">ЗАЯВКА</text>
  <text x="178" y="1680" font-family="Arial" font-size="52" font-weight="700" fill="#0D2147"><tspan x="178">Всё по рейсу —</tspan><tspan x="178" dy="59">в одной карточке</tspan></text>
  <text x="178" y="1830" font-family="Arial" font-size="29" fill="#526481"><tspan x="178">Маршрут, статусы, участники, ставки,</tspan><tspan x="178" dy="43">документы и прибыль. Первая договор-</tspan><tspan x="178" dy="43">заявка оформляется за </tspan><tspan fill="#13A848" font-weight="700">5 минут.</tspan></text>
  <rect x="846" y="1068" width="1502" height="1400" rx="34" fill="url(#screenFrame)"/>
  <image x="864" y="1118" width="1442" height="1302" preserveAspectRatio="xMidYMin slice" clip-path="url(#screenClip)" xlink:href="SCREENSHOT_DATA_URI"/>
  <rect x="888" y="2382" width="460" height="58" rx="16" fill="#0D2147"/>
  <text x="1118" y="2421" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#FFFFFF">Реальный интерфейс ЛогистРу</text>

  <!-- Scenarios -->
  <rect x="140" y="2530" width="54" height="54" rx="17" fill="#0D67F3"/><text x="167" y="2568" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#FFFFFF">2</text>
  <text x="214" y="2572" font-family="Arial" font-size="43" font-weight="700" fill="#0D2147">Два сценария работы с заявкой</text>
  <g font-family="Arial" fill="#0D2147">
    <g><rect x="132" y="2620" width="1085" height="250" rx="30" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="3"/><rect x="164" y="2652" width="54" height="54" rx="18" fill="#0D67F3"/><text x="191" y="2690" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">1</text><text x="240" y="2692" font-size="34" font-weight="700">Заявка от Заказчика</text>
      <g font-size="19" font-weight="700" text-anchor="middle"><g fill="#F0F5FF"><rect x="164" y="2740" width="210" height="94" rx="16"/><rect x="416" y="2740" width="210" height="94" rx="16"/><rect x="668" y="2740" width="240" height="94" rx="16"/><rect x="950" y="2740" width="230" height="94" rx="16"/></g><g fill="#17345F"><text x="269" y="2795">Получили заявку</text><text x="521" y="2795">Создали рейс</text><text x="788" y="2783"><tspan x="788">Передали</tspan><tspan x="788" dy="24">перевозчику</tspan></text><text x="1065" y="2795">Контроль и оплата</text></g></g>
      <g stroke="#7395C8" stroke-width="4"><path d="M382 2787H405M399 2780L406 2787L399 2794" fill="none"/><path d="M634 2787H657M651 2780L658 2787L651 2794" fill="none"/><path d="M916 2787H939M933 2780L940 2787L933 2794" fill="none"/></g>
    </g>
    <g><rect x="1235" y="2620" width="1113" height="250" rx="30" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="3"/><rect x="1267" y="2652" width="54" height="54" rx="18" fill="#17AC4C"/><text x="1294" y="2690" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">2</text><text x="1343" y="2692" font-size="34" font-weight="700">Поручение и ЭПД</text>
      <g font-size="19" font-weight="700" text-anchor="middle"><g fill="#EDF9F1"><rect x="1267" y="2740" width="220" height="94" rx="16"/><rect x="1529" y="2740" width="215" height="94" rx="16"/><rect x="1786" y="2740" width="245" height="94" rx="16"/><rect x="2073" y="2740" width="242" height="94" rx="16"/></g><g fill="#17345F"><text x="1377" y="2783"><tspan x="1377">Входящее</tspan><tspan x="1377" dy="24">поручение</tspan></text><text x="1636" y="2795">Заказ-заявка</text><text x="1908" y="2783"><tspan x="1908">ЭТрН в несколько</tspan><tspan x="1908" dy="24">кликов</tspan></text><text x="2194" y="2795">Архив и аналитика</text></g></g>
      <g stroke="#7395C8" stroke-width="4"><path d="M1495 2787H1518M1512 2780L1519 2787L1512 2794" fill="none"/><path d="M1752 2787H1775M1769 2780L1776 2787L1769 2794" fill="none"/><path d="M2039 2787H2062M2056 2780L2063 2787L2056 2794" fill="none"/></g>
    </g>
  </g>

  <!-- Value -->
  <rect x="132" y="2912" width="895" height="350" rx="34" fill="url(#value)"/>
  <text x="176" y="2970" font-family="Arial" font-size="24" font-weight="700" letter-spacing="1.5" fill="#FFFFFF" opacity=".82">НАША ГЛАВНАЯ ЦЕННОСТЬ</text>
  <text x="176" y="3045" font-family="Arial" font-size="34" font-weight="700" fill="#FFFFFF"><tspan x="176">Упрощаем процесс работы с заявкой</tspan><tspan x="176" dy="47">от Заказчика — делаем его простым,</tspan><tspan x="176" dy="47">понятным и удобным.</tspan></text>
  <rect x="1055" y="2912" width="1293" height="350" rx="34" fill="#FFFFFF" stroke="#DCE7F8" stroke-width="3"/>
  <text x="1098" y="2970" font-family="Arial" font-size="24" font-weight="700" letter-spacing="1.5" fill="#526481">ЦЕННОСТЬ ДЛЯ КЛИЕНТА</text>
  <g font-family="Arial" text-anchor="middle"><g fill="#F4F7FB"><rect x="1098" y="3000" width="282" height="140" rx="22"/><rect x="1394" y="3000" width="282" height="140" rx="22"/><rect x="1690" y="3000" width="282" height="140" rx="22"/><rect x="1986" y="3000" width="319" height="140" rx="22"/></g>
    <g fill="#0D67F3" font-size="37" font-weight="700"><text x="1239" y="3058">40 мин</text><text x="1535" y="3058">1 час</text><text x="1831" y="3058">5 мин</text><text x="2145" y="3058">1 ч 45 мин</text></g>
    <g fill="#526481" font-size="18" font-weight="700"><text x="1239" y="3100">презентация системы</text><text x="1535" y="3100">внедрение</text><text x="1831" y="3100">первая заявка</text><text x="2145" y="3100">до начала работы</text></g>
  </g>
  <rect x="1098" y="3160" width="1207" height="72" rx="18" fill="#E8F8ED"/>
  <text x="1701" y="3208" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#107F37">30–60% экономии времени на работу с документами</text>

  <!-- CTA -->
  <rect x="132" y="3296" width="2216" height="154" rx="34" fill="#18BA52"/>
  <text x="178" y="3370" font-family="Arial" font-size="47" font-weight="700" fill="#FFFFFF">Создайте кабинет и работайте правильно!</text>
  <text x="178" y="3415" font-family="Arial" font-size="24" fill="#EAFFF0">Начните с короткой презентации — и уже сегодня оформите первую заявку.</text>
  <rect x="2015" y="3336" width="285" height="78" rx="39" fill="#FFFFFF"/>
  <text x="2157" y="3388" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700" fill="#0D67F3">24logist.ru</text>
</svg>
