<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#173B78" flood-opacity="0.12"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#BBD1ED" opacity="0.42"/>
    </pattern>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#0D6EFD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .card { fill:#FFFFFF; stroke:#88B2EC; stroke-width:2; }
      .line { fill:none; stroke:#0D6EFD; stroke-width:9; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrowBlue); }
      .icon { fill:none; stroke:#071E5B; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .accent { fill:none; stroke:#0D6EFD; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
      .label { font-family:'Segoe UI',Arial,sans-serif; fill:#071E5B; font-size:28px; font-weight:650; }
      .center-label { font-family:'Segoe UI',Arial,sans-serif; fill:#071E5B; font-size:36px; font-weight:700; }
    </style>
  </defs>

  <rect width="1080" height="1350" fill="#FBFDFF"/>
  <rect x="22" y="22" width="1036" height="1306" rx="34" fill="url(#dots)" stroke="#D6E5F7" stroke-width="2"/>
  <circle cx="590" cy="610" r="250" fill="#DCEBFF" opacity="0.65" filter="url(#soft)"/>

  <!-- Connections -->
  <path class="line" d="M590 238 L590 400"/>
  <path class="line" d="M402 610 L370 610"/>
  <path class="line" d="M205 684 L205 765"/>
  <path class="line" d="M395 840 C465 840 470 790 485 748"/>
  <path class="line" d="M590 800 L590 1032"/>

  <!-- Top card -->
  <g filter="url(#shadow)">
    <rect class="card" x="280" y="78" width="620" height="160" rx="30"/>
  </g>
  <g transform="translate(323 110)">
    <rect class="icon" x="16" y="16" width="76" height="92" rx="8"/>
    <path class="icon" d="M40 16 V3 H68 V16"/>
    <path class="accent" d="M34 45 l8 8 14-18 M34 69 l8 8 14-18 M34 93 l8 8 14-18"/>
    <circle class="icon" cx="106" cy="68" r="21"/>
    <path class="icon" d="M73 118 C78 91 93 86 106 86 C121 86 136 94 140 118"/>
  </g>
  <text class="label" x="505" y="141">Поручение</text>
  <text class="label" x="505" y="180">экспедитору (заказчик)</text>

  <!-- Left order card -->
  <g filter="url(#shadow)">
    <rect class="card" x="48" y="535" width="322" height="150" rx="28"/>
  </g>
  <g transform="translate(72 565)">
    <path class="icon" d="M8 0 H66 L91 25 V92 H8 Z"/>
    <path class="icon" d="M66 0 V25 H91"/>
    <path class="icon" d="M27 38 H68 M27 58 H68"/>
    <rect class="accent" x="27" y="72" width="42" height="20" rx="2"/>
  </g>
  <text class="label" x="183" y="596">Заказ-заявка</text>
  <text class="label" x="183" y="636">(перевозчику)</text>

  <!-- Lower-left data card -->
  <g filter="url(#shadow)">
    <rect class="card" x="48" y="765" width="347" height="150" rx="28"/>
  </g>
  <g transform="translate(68 803)">
    <path class="icon" d="M3 14 H63 V70 H3 Z M63 29 H87 L101 45 V70 H63 Z"/>
    <circle class="icon" cx="24" cy="73" r="13"/>
    <circle class="icon" cx="82" cy="73" r="13"/>
    <circle class="icon" cx="112" cy="45" r="17"/>
    <path class="icon" d="M85 94 C90 72 101 66 112 66 C125 66 136 73 140 94"/>
  </g>
  <text class="label" x="220" y="823">Данные по</text>
  <text class="label" x="220" y="861">водителю и авто</text>

  <!-- Central hub -->
  <g filter="url(#shadow)">
    <circle cx="590" cy="610" r="190" fill="#FFFFFF" stroke="#0D6EFD" stroke-width="7"/>
  </g>
  <g transform="translate(500 475)">
    <rect class="icon" x="0" y="0" width="180" height="125" rx="16"/>
    <path class="icon" d="M0 31 H180"/>
    <circle class="icon" cx="54" cy="72" r="25"/>
    <path class="icon" d="M29 108 C34 87 43 82 54 82 C66 82 76 88 80 108"/>
    <path class="icon" d="M103 64 H156 M103 88 H156"/>
    <path class="accent" d="M103 111 H130 M142 111 H166"/>
  </g>
  <text class="center-label" x="590" y="665" text-anchor="middle">Карточка</text>
  <text class="center-label" x="590" y="710" text-anchor="middle">заявки</text>

  <!-- Bottom ETRN card -->
  <g filter="url(#shadow)">
    <rect x="390" y="1032" width="400" height="145" rx="30" fill="#FFFFFF" stroke="#12A253" stroke-width="2"/>
  </g>
  <g transform="translate(430 1057)">
    <path d="M5 0 H70 L98 28 V100 H5 Z M70 0 V28 H98" fill="none" stroke="#12A253" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27 43 H73 M27 64 H73 M27 85 H56" fill="none" stroke="#12A253" stroke-width="6" stroke-linecap="round"/>
    <circle cx="99" cy="88" r="28" fill="#12A253"/>
    <path d="M84 88 l10 10 20-25" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="590" y="1122" font-family="'Segoe UI',Arial,sans-serif" fill="#12A253" font-size="42" font-weight="750">ЭТРН</text>
</svg>
